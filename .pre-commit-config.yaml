---
# Run everything against the working tree with: just lint
# Install the hooks (including commit-msg and pre-push) with: just setup

default_language_version:
  python: python3

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

exclude: |
  (?x)^(
    LICENSE|
    output/.*
  )$

repos:
  #################################################################
  # Whitespace and file hygiene
  #################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: fix-byte-order-marker
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: forbid-submodules
      # The CA scripts are destructive enough that changes should go through a
      # branch and a review, not straight onto main.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      # Shell here is indented with spaces throughout; a stray tab in a
      # heredoc or a config file is always a mistake.
      - id: forbid-tabs
      - id: remove-tabs
        args: [--whitespaces-count, '4']

  #################################################################
  # Shell linting - this repo is almost entirely bash
  #################################################################
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x lets shellcheck follow `source` into .env.example and the
        # function libraries instead of warning about them.
        args: [--external-sources, --severity=warning]

  #################################################################
  # Credentials and secrets
  #################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks

  # Content scanners miss a key that has been renamed or moved out of the
  # ignored directory, so block the paths as well.
  - repo: local
    hooks:
      - id: forbid-secret-files
        name: forbid committing CA keys, certs and .env
        entry: hooks/forbid-secret-files.sh
        language: script
        pass_filenames: true
        exclude: |
          (?x)^(
            \.env\.example
          )$

  #################################################################
  # Conventional Commits
  #################################################################
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      # Checks the message of the commit being made.
      - id: commitizen
        stages: [commit-msg]
      # Checks every message in the range being pushed, so a bad message that
      # was committed with --no-verify still cannot reach the remote.
      - id: commitizen-branch
        stages: [pre-push]
        args: [--rev-range, origin/HEAD..HEAD]
